<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shieldaig · Feed</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <nav class="sidenav" id="sidenav"></nav>

    <main class="main">
      <div class="main-header">
        <h1>The Log</h1>
        <div class="sub">Live from the North Coast 500</div>
      </div>
      <div class="route-rule accent"></div>

      <section class="composer">
        <div class="composer-row">
          <div id="composer-avatar"></div>
          <textarea id="composer-text" placeholder="How's the water today?" rows="2"></textarea>
        </div>
        <div class="media-preview hidden" id="composer-preview"></div>
        <input type="file" id="composer-file" class="hidden">
        <div class="composer-foot">
          <div class="composer-tools">
            <button class="icon-btn" id="composer-img-btn" title="Add photo"></button>
            <button class="icon-btn" id="composer-vid-btn" title="Add video"></button>
          </div>
          <button class="btn btn-primary btn-sm" id="composer-post">Log it</button>
        </div>
      </section>

      <section class="feed" id="feed">
        <div class="loader"></div>
      </section>
    </main>

    <aside class="rail">
      <div class="rail-card">
        <h3>Shieldaig, Wester Ross</h3>
        <div class="rail-stat"><span>Route</span><span class="v">NC500</span></div>
        <div class="rail-stat"><span>Nearest launch</span><span class="v">Shieldaig Slipway</span></div>
        <div class="rail-stat"><span>Best tide</span><span class="v">2h before HW</span></div>
      </div>
      <div class="rail-card">
        <h3>Paddler's reminder</h3>
        <p style="font-size:13px;color:var(--color-ink-soft);margin:0;">Always check the Met Office marine forecast and file a passage plan before you launch.</p>
      </div>
    </aside>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/feed.js"></script>
  <script type="module">
    import { avatarHTML } from "./js/utils.js";
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { db } from "./js/firebase-config.js";
    onAuthStateChanged(auth, async (user)=>{
      if(!user) return;
      const snap = await getDoc(doc(db,"users",user.uid));
      const p = snap.exists() ? snap.data() : {};
      document.getElementById("composer-avatar").innerHTML = avatarHTML(p.photoURL, p.displayName || user.displayName, 40);
    });
  </script>
  <script type="module">
    import { ICONS } from "./js/utils.js";
    document.getElementById("composer-img-btn").innerHTML = ICONS.image;
    document.getElementById("composer-vid-btn").innerHTML = ICONS.video;
  </script>
</body>
</html>
